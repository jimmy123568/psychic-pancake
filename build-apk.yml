name: Build Mario64 APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create the Android project from mario64.html
        run: |
          mkdir -p app/src/main/java/com/example/mario64 app/src/main/assets
          cp mario64.html app/src/main/assets/page.txt
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Mario64"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.mario64'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.mario64'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Mario 64"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/mario64/MainActivity.java <<'EOF'
          package com.example.mario64;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> filePicker;
              private static final int PICK = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);          // the game saves with localStorage
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      // lets "Import save backup" open the file picker
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePicker != null) filePicker.onReceiveValue(null);
                          filePicker = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          startActivityForResult(Intent.createChooser(i, "Choose save backup"), PICK);
                          return true;
                      }
                  });

                  // The page is stored as page.txt so AIDE's old HTML checker leaves it alone.
                  web.loadDataWithBaseURL("file:///android_asset/", readAsset("page.txt"),
                          "text/html", "UTF-8", null);
              }

              private String readAsset(String name) {
                  try {
                      InputStream in = getAssets().open(name);
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      return out.toString("UTF-8");
                  } catch (Exception e) {
                      return "<html><body style='color:#fff;background:#000'>Could not load page.txt</body></html>";
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == PICK && filePicker != null) {
                      Uri[] result = null;
                      if (res == RESULT_OK && data != null && data.getData() != null) {
                          result = new Uri[] { data.getData() };
                      }
                      filePicker.onReceiveValue(result);
                      filePicker = null;
                  }
                  super.onActivityResult(req, res, data);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF
      - name: Build the APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mario64-APK
          path: app/build/outputs/apk/debug/app-debug.apk
